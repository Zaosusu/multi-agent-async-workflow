<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Pipeline Topology Patterns</title>
  <desc>Linear, DAG, Ring feedback, and Fan-in/Fan-out topology patterns</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font: 500 13px sans-serif; }
    .ts { font: 400 11px sans-serif; }
    .tl { font: 500 12px sans-serif; }
    .arr { fill: none; stroke: #999; stroke-width: 1.5; }
  </style>

  <text class="tl" x="40" y="30" dominant-baseline="central" fill="#3C3489">线性流水线 / Linear</text>
  <text class="ts" x="220" y="30" dominant-baseline="central" fill="#888">需求明确、流程标准</text>

  <rect x="40" y="50" width="90" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="85" y="68" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Planner</text>
  <path class="arr" d="M130 68 L155 68" marker-end="url(#arrow3)"/>
  <rect x="155" y="50" width="100" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="205" y="68" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Researcher</text>
  <path class="arr" d="M255 68 L280 68" marker-end="url(#arrow3)"/>
  <rect x="280" y="50" width="80" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="320" y="68" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Executor</text>
  <path class="arr" d="M360 68 L385 68" marker-end="url(#arrow3)"/>
  <rect x="385" y="50" width="80" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="425" y="68" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Reviewer</text>
  <path class="arr" d="M465 68 L490 68" marker-end="url(#arrow3)"/>
  <rect x="490" y="50" width="90" height="36" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="535" y="68" text-anchor="middle" dominant-baseline="central" fill="#085041">Done</text>

  <text class="tl" x="40" y="130" dominant-baseline="central" fill="#3C3489">DAG 有向无环图 / DAG</text>
  <text class="ts" x="230" y="130" dominant-baseline="central" fill="#888">并行任务、部分需研究</text>

  <rect x="40" y="150" width="90" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="85" y="168" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Planner</text>
  <path class="arr" d="M85 186 L85 210 L200 210 L200 225" marker-end="url(#arrow3)"/>
  <path class="arr" d="M85 186 L85 225" marker-end="url(#arrow3)"/>
  <path class="arr" d="M85 186 L85 210 L400 210 L400 225" marker-end="url(#arrow3)"/>
  <rect x="40" y="225" width="90" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="85" y="243" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Executor-A</text>
  <rect x="155" y="225" width="90" height="36" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text class="th" x="200" y="243" text-anchor="middle" dominant-baseline="central" fill="#633806">Researcher</text>
  <path class="arr" d="M200 261 L200 280 L400 280 L400 295" marker-end="url(#arrow3)"/>
  <rect x="400" y="225" width="90" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="445" y="243" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Executor-B</text>
  <rect x="400" y="295" width="90" height="36" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="445" y="313" text-anchor="middle" dominant-baseline="central" fill="#085041">Done</text>

  <text class="tl" x="40" y="360" dominant-baseline="central" fill="#3C3489">环形反馈 / Ring Feedback</text>
  <text class="ts" x="230" y="360" dominant-baseline="central" fill="#888">高质量要求、允许迭代修正</text>

  <rect x="180" y="380" width="90" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="225" y="398" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Executor</text>
  <path class="arr" d="M270 398 L330 398" marker-end="url(#arrow3)"/>
  <rect x="330" y="380" width="90" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="375" y="398" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Reviewer</text>
  <path class="arr" d="M375 416 Q 300 445 225 416" marker-end="url(#arrow3)" stroke="#D85A30" stroke-dasharray="4 3" fill="none"/>
  <text class="ts" x="300" y="438" text-anchor="middle" dominant-baseline="central" fill="#993C1D">打回修正</text>
  <path class="arr" d="M420 398 L480 398" marker-end="url(#arrow3)"/>
  <rect x="480" y="380" width="60" height="36" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="510" y="398" text-anchor="middle" dominant-baseline="central" fill="#085041">Done</text>
  <text class="ts" x="445" y="370" text-anchor="middle" dominant-baseline="central" fill="#1D9E75">通过</text>

  <text class="tl" x="40" y="470" dominant-baseline="central" fill="#3C3489">扇入/扇出 / Fan-out Fan-in</text>
  <text class="ts" x="250" y="470" dominant-baseline="central" fill="#888">Epic 拆分子任务、最后集成</text>

  <rect x="270" y="490" width="90" height="36" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="315" y="508" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Planner</text>
  <path class="arr" d="M290 526 L290 535 L120 535 L120 540" marker-end="url(#arrow3)"/>
  <path class="arr" d="M315 526 L315 540" marker-end="url(#arrow3)"/>
  <path class="arr" d="M340 526 L340 535 L510 535 L510 540" marker-end="url(#arrow3)"/>
  <rect x="75" y="540" width="90" height="32" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="ts" x="120" y="556" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Executor-A</text>
  <rect x="270" y="540" width="90" height="32" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="ts" x="315" y="556" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Executor-B</text>
  <rect x="465" y="540" width="90" height="32" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="ts" x="510" y="556" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Executor-C</text>
</svg>
