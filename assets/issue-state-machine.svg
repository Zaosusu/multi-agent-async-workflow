<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Issue State Machine</title>
  <desc>Issue lifecycle from backlog to done, including approval, integration, and exception branches</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font: 500 13px sans-serif; }
    .ts { font: 400 11px sans-serif; }
    .arr { fill: none; stroke: #999; stroke-width: 1.5; }
    .dash { fill: none; stroke: #bbb; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .reject { fill: none; stroke: #D85A30; stroke-width: 1.5; }
  </style>

  <g fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5">
    <rect x="10" y="48" width="110" height="44" rx="8"/>
    <rect x="145" y="48" width="110" height="44" rx="8"/>
    <rect x="280" y="48" width="110" height="44" rx="8"/>
    <rect x="415" y="48" width="120" height="44" rx="8"/>
  </g>
  <g class="th" text-anchor="middle" dominant-baseline="central" fill="#0C447C">
    <text x="65" y="70">backlog</text>
    <text x="200" y="70">ready</text>
    <text x="335" y="70">in_progress</text>
    <text x="475" y="70">needs-review</text>
  </g>
  <rect x="560" y="48" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="615" y="70" text-anchor="middle" dominant-baseline="central" fill="#085041">approved</text>
  <rect x="705" y="48" width="90" height="44" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="750" y="70" text-anchor="middle" dominant-baseline="central" fill="#085041">done</text>

  <path class="arr" d="M120 70H145 M255 70H280 M390 70H415 M535 70H560 M670 70H705" marker-end="url(#arrow)"/>
  <text class="ts" x="680" y="37" text-anchor="middle" fill="#5F5E5A">合并并在 main 验证</text>

  <path class="reject" d="M445 93 Q365 133 335 93" marker-end="url(#arrow)"/>
  <text class="ts" x="390" y="122" text-anchor="middle" fill="#993C1D">审核打回</text>
  <path class="reject" d="M590 93 Q480 150 335 93" marker-end="url(#arrow)"/>
  <text class="ts" x="505" y="141" text-anchor="middle" fill="#993C1D">集成发现问题</text>

  <rect x="110" y="205" width="130" height="44" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text class="th" x="175" y="227" text-anchor="middle" dominant-baseline="central" fill="#633806">needs-research</text>
  <rect x="290" y="205" width="110" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="th" x="345" y="227" text-anchor="middle" dominant-baseline="central" fill="#712B13">blocked</text>
  <rect x="450" y="205" width="110" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="th" x="505" y="227" text-anchor="middle" dominant-baseline="central" fill="#712B13">needs-lead</text>
  <rect x="610" y="205" width="120" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="th" x="670" y="227" text-anchor="middle" dominant-baseline="central" fill="#712B13">needs-human</text>

  <path class="dash" d="M200 93L175 205 M175 205Q155 145 200 93" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="dash" d="M335 93V205 M345 205Q300 150 335 93" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="dash" d="M375 93Q440 145 505 205 M505 205Q420 155 370 93" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="dash" d="M390 93Q530 145 670 205 M670 205Q510 155 385 93" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text class="ts" x="430" y="292" text-anchor="middle" fill="#5F5E5A">异常状态解除后回到 ready 或 in_progress；done 仅在 main 验证通过后设置</text>
  <text class="ts" x="430" y="320" text-anchor="middle" fill="#888">实线 = 正常流转 · 虚线 = 异常分支 · 橙色 = 退回实施</text>
</svg>
